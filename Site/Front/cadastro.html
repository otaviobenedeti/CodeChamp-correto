<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeChamp</title>
    <link rel="stylesheet" href="stylelogin.css">
</head>

<body>
    <section class="auth-card">
        <header class="logo-container">
            <img src="./assets/logotrofeu.png" alt="CodeChamp Logo" class="logo-img">
            <h1 class="brand-name">Code<span>Champ</span></h1>
            <p class="subtitle">Aprenda Programação com Desafios</p>
        </header>

        <form id="formCadastro">

            <input type="text" id="nome" placeholder="Nome Completo" required>

            <input type="text" id="username" placeholder="Nome de Usuário" required>

            <input type="email" id="email" placeholder="email@dominio.com" required>

            <div style="position: relative;">

                <input type="password" id="senha" placeholder="Senha" required
                    style="width: 100%; padding-right: 40px;">

                <span onclick="toggleSenha()" style="
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
            ">
                    👁️‍🗨️
                </span>

            </div>

            <input type="tel" id="telefone" placeholder="+55 (00) 00000-0000" maxlength="19" required>

            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>

            <input type="date" id="dataNascimento" required>

            <div>

                <span id="flag" class="fi fi-br"></span>

                <input type="text" id="countryInput" list="countries" placeholder="Nacionalidade" autocomplete="off">

            </div>

            <datalist id="countries">
                <option value="Brasil">
                <option value="Estados Unidos">
                <option value="Japão">
                <option value="Canadá">
                <option value="França">
                <option value="Alemanha">
                <option value="Portugal">
                <option value="Argentina">
                <option value="China">
                <option value="Coreia do Sul">
            </datalist>

            <button type="submit" class="btn-primary">
                Cadastrar-se
            </button>

        </form>

        <a href="login.html" class="switch-link">Já possui conta? Voltar</a>
    </section>
    </main>
    <script src="script.js"></script>
    <script src="cadastro.js"></script>
</body>

</html>
